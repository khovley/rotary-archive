# Rotary Archive configuration.
# Paths are relative to this file's directory unless absolute.

[paths]
inbox       = "inbox"
originals   = "masters/originals"
items       = "masters/items"
derivatives = "derivatives"
exports     = "exports"
site        = "site"
database    = "archive.db"

[segment]
# Long-edge pixels used for detection. Detection runs on a downscaled copy for
# speed; coordinates are mapped back to full resolution before warping.
work_long_edge = 2000

# Candidate area as a fraction of the source frame. Below min = noise/shadow,
# above max = the background itself was detected.
min_area_frac = 0.015
max_area_frac = 0.90

# Reject long thin slivers (table edges, pen shadows).
max_aspect_ratio = 8.0

# Reject ragged shapes (hands, folds, cast shadows). contour_area / hull_area.
# Deliberately permissive: real clippings are often cut around a headline or a
# photo, so an L or T shape is normal rather than a sign of a bad detection.
# 0.80 rejected genuine clippings; a hand or a cast shadow still scores well
# below 0.55.
min_solidity = 0.55

# How much of its own fitted quad a contour must fill. An L-shaped clipping
# only fills about half its bounding box, so this has to stay low; the crop
# still contains the whole item, with some table showing in the notch.
min_fill = 0.42

# Two candidates overlapping more than this are treated as the same item.
iou_merge_threshold = 0.35

# A single candidate covering more than this fraction of the frame means the
# photo is of one item, shot close up.
single_item_frac = 0.85

# Ask a vision model to read the photo and mark out each item, then snap those
# regions onto the real paper edges. Contour detection alone cannot tell that a
# headline strip belongs to the columns beneath it, or that two strips are one
# story continued - which is most of what a table of overlapping newsprint is.
#
# Costs one model call per photo, so it is off by default. Turn it on here, or
# per run with `rotary segment --ai`.
use_vision = false

[rectify]
# Residual rotation search range for the fine deskew, in degrees. Perspective
# correction handles the gross angle; this cleans up the last fraction.
max_fine_skew_deg = 5.0

# Don't bother rotating for less than this - resampling costs more than it gains.
min_fine_skew_deg = 0.15

# JPEG quality for the full-resolution archival item master.
master_quality = 95

# Long-edge sizes for published WebP derivatives.
derivative_sizes = [1600, 800, 320]
derivative_quality = 82

[review]
host = "127.0.0.1"
port = 8765

# Items below this detection confidence are surfaced in the "flagged" view.
# Calibrated against the synthetic benchmark: clean shots on a contrasting
# background score 0.86-1.00, while crops where the detection passes disagreed
# about the item's edge fall to 0.75 or below. 0.80 separates those cleanly.
flag_below_confidence = 0.80

[site]
club_name = "Rotary Club"
tagline   = "A history in clippings, photographs, and paper"
# Shown on the "help us identify" prompt for unidentified photographs.
contact   = ""

# Long-edge size used for the main image on an item page. Must be one of the
# derivative sizes above.
detail_image_size = 1600
thumb_image_size  = 320
card_image_size   = 800

[publish]
# How to upload the built site. "rsync" transfers only what changed and is the
# right choice when the host offers SSH. "sftp" is the fallback for hosts that
# allow file transfer but not rsync; it re-uploads everything each time.
# "local" copies to a directory on this machine - useful for testing, or for a
# host you sync some other way (Dropbox, a mounted volume).
method = "rsync"                # rsync | sftp | local

host = ""                       # e.g. "yourclub.org"
user = ""                       # SSH username
port = 22
remote_path = ""                # e.g. "/home/you/public_html/history"

# Optional path to a specific SSH key. Leave empty to let SSH use your agent
# and ~/.ssh/config, which is the usual case.
identity = ""

# For method = "local": where to copy to.
local_path = ""

# Never uploaded, whatever else happens.
exclude = [".DS_Store", "Thumbs.db", "*.map"]

# Remove remote files that are not in the local build. Off by default: the
# target directory may contain files this tool did not put there, and deleting
# a stranger's files on a live club site is not recoverable from here.
delete = false

# There is deliberately no password setting. Authentication is left to your
# SSH agent, key, or an interactive prompt from ssh itself - a password sitting
# in a config file is a password in your backups and your git history.

[llm]
# claude_cli runs analysis through the Claude subscription already installed on
# this machine, so no API key is needed. Switch to "anthropic" with
# ANTHROPIC_API_KEY set when you want batch pricing and real throughput - the
# CLI is serial and much slower, which matters at a few hundred items.
provider = "claude_cli"         # anthropic | openai | gemini | ollama | claude_cli
model    = "claude-sonnet-5"

# Batch runs bill at half price and are not latency-sensitive, which suits a
# first pass over a whole collection: submit it and come back later. Turn this
# off for small interactive runs where waiting for the queue is the slow part.
use_batch = true

# Used only when the provider has no batch endpoint.
max_concurrency = 4

# Ceiling on a single response. Generous because a dense newspaper column can
# run long and, on models where thinking is on by default, thinking and the
# response share this budget - too low truncates the transcription.
max_tokens = 8000

# Optional: "low" | "medium" | "high" | "xhigh" | "max". Leave unset for the
# API default. Higher settings read faint print more carefully at more cost.
# effort = "high"

# Derivative size sent to the vision model. 1600 sits well inside the
# high-resolution ceiling while costing roughly half the image tokens of a
# full-size upload, with no legibility loss on a rectified crop.
analyze_image_size = 1600

# --- Provider-specific -------------------------------------------------------
# ollama_host = "http://127.0.0.1:11434"
# ollama_timeout = 300
# claude_executable = "claude"
# Reading a whole table of clippings and marking out every one takes the CLI
# noticeably longer than cataloguing a single cropped item, and the correction
# pass longer still. 300s is enough for analysis but truncates segmentation.
cli_timeout = 900
