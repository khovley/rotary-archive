[project]
name = "rotary-archive"
version = "0.1.0"
description = "Turn iPhone photos of analogue club memorabilia into a searchable interactive history"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.9",
    "numpy<2",
    "pillow>=10",
    "pillow-heif>=0.15",
    "pydantic>=2",
    "typer>=0.12",
    "rich>=13",
    "jinja2>=3",
    "python-dateutil>=2.8",
    "tomli>=2; python_version < '3.11'",
    "anthropic>=0.60",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
gemini = ["google-genai>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
rotary = "rotary_archive.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rotary_archive = [
    "schema.sql",
    "review/static/*",
    "build/templates/*",
    "build/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
